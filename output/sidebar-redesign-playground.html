<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entomate — Sidebar Redesign Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Reset ─────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Tokens ─────────────────────────────────────────────── */
  :root {
    --en-primary:        #FF2D6B;
    --en-primary-dim:    rgba(255,45,107,0.12);
    --en-primary-glow:   rgba(255,45,107,0.35);
    --en-secondary:      #00F5D4;
    --en-tertiary:       #FFB800;
    --en-bg-abyss:       #080808;
    --en-bg-surface:     #101010;
    --en-bg-elevated:    #181818;
    --en-text-primary:   #F8F0F2;
    --en-text-secondary: #968890;
    --en-border-default: rgba(248,240,242,0.16);
    --en-font-display:   'Syne', sans-serif;
    --en-font-body:      'Space Grotesk', sans-serif;
  }

  /* ── Base ────────────────────────────────────────────────── */
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--en-bg-abyss);
    color: var(--en-text-primary);
    font-family: var(--en-font-body);
    font-size: 14px;
  }

  /* ── App Shell ───────────────────────────────────────────── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Top Header ──────────────────────────────────────────── */
  #header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    height: 52px;
    background: var(--en-bg-surface);
    border-bottom: 1px solid var(--en-border-default);
    flex-shrink: 0;
  }
  #header-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #header-logo svg { flex-shrink: 0; }
  #header-wordmark {
    font-family: var(--en-font-display);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.02em;
    color: var(--en-text-primary);
  }
  #header-wordmark span { color: var(--en-primary); }
  #header-badge {
    margin-left: 4px;
    padding: 2px 8px;
    background: var(--en-primary-dim);
    border: 1px solid rgba(255,45,107,0.3);
    border-radius: 4px;
    font-family: var(--en-font-display);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--en-primary);
    text-transform: uppercase;
  }
  #header-subtitle {
    margin-left: auto;
    font-family: var(--en-font-display);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--en-text-secondary);
  }

  /* ── Workspace ───────────────────────────────────────────── */
  #workspace {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* ── Control Panel ───────────────────────────────────────── */
  #controls {
    width: 340px;
    flex-shrink: 0;
    background: var(--en-bg-surface);
    border-right: 1px solid var(--en-border-default);
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  #controls::-webkit-scrollbar { width: 4px; }
  #controls::-webkit-scrollbar-track { background: transparent; }
  #controls::-webkit-scrollbar-thumb { background: var(--en-border-default); border-radius: 4px; }

  .controls-heading {
    font-family: var(--en-font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--en-text-secondary);
    margin-bottom: 2px;
  }

  /* Control group */
  .ctrl-group { display: flex; flex-direction: column; gap: 10px; }
  .ctrl-label {
    font-family: var(--en-font-display);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--en-primary);
  }

  /* Segmented control */
  .seg-ctrl {
    display: flex;
    gap: 2px;
    background: var(--en-bg-elevated);
    border: 1px solid var(--en-border-default);
    border-radius: 8px;
    padding: 3px;
  }
  .seg-btn {
    flex: 1;
    padding: 7px 6px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--en-text-secondary);
    font-family: var(--en-font-body);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    transition: color 0.15s, background 0.15s;
    line-height: 1.2;
  }
  .seg-btn:hover {
    color: var(--en-text-primary);
    background: rgba(248,240,242,0.06);
  }
  .seg-btn.active {
    background: var(--en-primary);
    color: #fff;
    font-weight: 600;
  }

  /* Divider */
  .ctrl-divider {
    height: 1px;
    background: var(--en-border-default);
    margin: 0 -4px;
  }

  /* ── Preview Panel ───────────────────────────────────────── */
  #preview {
    flex: 1;
    min-width: 0;
    background: var(--en-bg-abyss);
    display: flex;
    align-items: stretch;
    overflow: hidden;
    position: relative;
  }

  /* Grid bg */
  #preview::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(248,240,242,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(248,240,242,0.025) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  /* Sidebar wrapper */
  #sidebar-wrap {
    position: relative;
    height: 100%;
    display: flex;
  }

  /* The actual sidebar */
  #sidebar {
    height: 100%;
    background: var(--en-bg-surface);
    border-right: 1px solid var(--en-border-default);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  /* App canvas area next to sidebar */
  #app-canvas {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    opacity: 0.25;
    user-select: none;
    padding: 40px;
  }
  .canvas-card {
    width: 100%;
    max-width: 520px;
    height: 64px;
    background: var(--en-bg-elevated);
    border: 1px solid var(--en-border-default);
    border-radius: 10px;
  }
  .canvas-card:first-child { height: 36px; max-width: 280px; align-self: flex-start; }
  .canvas-card:last-child { height: 180px; }

  /* ── Sidebar Internals ─────────────────────────────────── */
  #sb-logo-area {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    border-bottom: 1px solid var(--en-border-default);
  }

  #sb-nav {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 0;
  }
  #sb-nav::-webkit-scrollbar { width: 3px; }
  #sb-nav::-webkit-scrollbar-track { background: transparent; }
  #sb-nav::-webkit-scrollbar-thumb { background: var(--en-border-default); border-radius: 4px; }

  #sb-footer {
    flex-shrink: 0;
    border-top: 1px solid var(--en-border-default);
  }

  /* Nav items */
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    position: relative;
    color: var(--en-text-secondary);
    font-family: var(--en-font-body);
    font-weight: 500;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    transition: color 0.15s;
  }
  .nav-item:hover { color: var(--en-text-primary); }
  .nav-item.active { color: var(--en-text-primary); }

  .nav-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
    line-height: 1;
  }

  .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .nav-badge {
    flex-shrink: 0;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: var(--en-primary);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--en-font-display);
  }

  /* Section separator */
  .nav-section-label {
    font-family: var(--en-font-display);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--en-text-secondary);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .section-chevron {
    flex-shrink: 0;
    color: var(--en-text-secondary);
    transition: transform 0.2s;
  }
  .section-header {
    display: flex;
    align-items: center;
    cursor: pointer;
    gap: 6px;
  }
  .section-items { overflow: hidden; }
  .section-collapsed .section-items { display: none; }
  .section-collapsed .section-chevron { transform: rotate(-90deg); }

  /* Settings nav item */
  .settings-item {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    color: var(--en-text-secondary);
    font-family: var(--en-font-body);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    transition: color 0.15s;
  }
  .settings-item:hover { color: var(--en-text-primary); }

  /* User area */
  #sb-user { display: flex; align-items: center; }

  /* Pulse animation */
  @keyframes pulse-ring {
    0%   { transform: scale(1);   opacity: 0.8; }
    70%  { transform: scale(1.6); opacity: 0; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .pulse-dot {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--en-primary);
    animation: pulse-ring 1.8s ease-out infinite;
  }

  /* ── Bottom Output Bar ───────────────────────────────────── */
  #output-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--en-bg-surface);
    border-top: 1px solid var(--en-border-default);
    flex-shrink: 0;
  }
  #prompt-output {
    flex: 1;
    padding: 10px 14px;
    background: var(--en-bg-elevated);
    border: 1px solid var(--en-border-default);
    border-radius: 8px;
    color: var(--en-text-secondary);
    font-family: var(--en-font-body);
    font-size: 12px;
    resize: none;
    outline: none;
    height: 42px;
    overflow: hidden;
    white-space: nowrap;
    cursor: default;
  }
  .btn {
    flex-shrink: 0;
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-family: var(--en-font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.01em;
  }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }
  .btn-secondary {
    background: var(--en-bg-elevated);
    color: var(--en-text-primary);
    border: 1px solid var(--en-border-default);
  }
  .btn-primary {
    background: var(--en-primary);
    color: #fff;
  }

  /* Scrollbar for whole page */
  body::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<div id="app">

  <!-- Header -->
  <header id="header">
    <div id="header-logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" rx="7" fill="#FF2D6B" fill-opacity="0.15"/>
        <path d="M7 9.5L14 6L21 9.5V14.5C21 18.09 17.87 21.36 14 22.5C10.13 21.36 7 18.09 7 14.5V9.5Z" stroke="#FF2D6B" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
        <circle cx="14" cy="14" r="2.5" fill="#FF2D6B"/>
      </svg>
      <span id="header-wordmark">ento<span>mate</span></span>
      <span id="header-badge">Playground</span>
    </div>
    <span id="header-subtitle">Sidebar Redesign · Void × Crimson</span>
  </header>

  <!-- Workspace -->
  <div id="workspace">

    <!-- Control Panel -->
    <aside id="controls">
      <div>
        <p class="controls-heading">Design Controls</p>
      </div>

      <!-- 1: Sidebar Width -->
      <div class="ctrl-group" id="ctrl-width">
        <span class="ctrl-label">Sidebar Width</span>
        <div class="seg-ctrl" data-ctrl="width">
          <button class="seg-btn" data-val="icon">Icon (52px)</button>
          <button class="seg-btn" data-val="compact">Compact (180px)</button>
          <button class="seg-btn active" data-val="full">Full (240px)</button>
        </div>
      </div>

      <div class="ctrl-divider"></div>

      <!-- 2: Nav Item Style -->
      <div class="ctrl-group">
        <span class="ctrl-label">Nav Item Style</span>
        <div class="seg-ctrl" data-ctrl="navStyle">
          <button class="seg-btn active" data-val="pill">Pill</button>
          <button class="seg-btn" data-val="fullbleed">Full-bleed</button>
          <button class="seg-btn" data-val="card">Floating card</button>
        </div>
      </div>

      <div class="ctrl-divider"></div>

      <!-- 3: Active Indicator -->
      <div class="ctrl-group">
        <span class="ctrl-label">Active Indicator</span>
        <div class="seg-ctrl" data-ctrl="activeIndicator">
          <button class="seg-btn active" data-val="leftbar">Left bar</button>
          <button class="seg-btn" data-val="glow">Glow fill</button>
          <button class="seg-btn" data-val="dot">Dot</button>
          <button class="seg-btn" data-val="underline">Underline</button>
        </div>
      </div>

      <div class="ctrl-divider"></div>

      <!-- 4: Icon Treatment -->
      <div class="ctrl-group">
        <span class="ctrl-label">Icon Treatment</span>
        <div class="seg-ctrl" data-ctrl="iconTreatment">
          <button class="seg-btn" data-val="mono">Monochrome</button>
          <button class="seg-btn active" data-val="accent">Accent colored</button>
          <button class="seg-btn" data-val="filled">Filled bg</button>
        </div>
      </div>

      <div class="ctrl-divider"></div>

      <!-- 5: Logo Treatment -->
      <div class="ctrl-group">
        <span class="ctrl-label">Logo Treatment</span>
        <div class="seg-ctrl" data-ctrl="logoTreatment">
          <button class="seg-btn active" data-val="wordmark">Wordmark</button>
          <button class="seg-btn" data-val="icononly">Icon only</button>
          <button class="seg-btn" data-val="pulse">Pulse animated</button>
        </div>
      </div>

      <div class="ctrl-divider"></div>

      <!-- 6: Section Grouping -->
      <div class="ctrl-group">
        <span class="ctrl-label">Section Grouping</span>
        <div class="seg-ctrl" data-ctrl="sectionGrouping">
          <button class="seg-btn" data-val="none">None</button>
          <button class="seg-btn active" data-val="grouped">Grouped</button>
          <button class="seg-btn" data-val="collapsible">Collapsible</button>
        </div>
      </div>

      <div class="ctrl-divider"></div>

      <!-- 7: Bottom User Area -->
      <div class="ctrl-group">
        <span class="ctrl-label">Bottom User Area</span>
        <div class="seg-ctrl" data-ctrl="userArea">
          <button class="seg-btn" data-val="minimal">Minimal</button>
          <button class="seg-btn active" data-val="avatar">Avatar card</button>
          <button class="seg-btn" data-val="expanded">Expanded</button>
        </div>
      </div>

    </aside>

    <!-- Preview Panel -->
    <main id="preview">
      <div id="sidebar-wrap">
        <nav id="sidebar">
          <div id="sb-logo-area"></div>
          <div id="sb-nav"></div>
          <div id="sb-footer">
            <div id="sb-settings"></div>
            <div id="sb-user"></div>
          </div>
        </nav>
        <div id="app-canvas">
          <div class="canvas-card"></div>
          <div class="canvas-card"></div>
          <div class="canvas-card"></div>
          <div class="canvas-card"></div>
        </div>
      </div>
    </main>

  </div><!-- /workspace -->

  <!-- Output Bar -->
  <div id="output-bar">
    <textarea id="prompt-output" readonly></textarea>
    <button class="btn btn-secondary" id="btn-reset">Reset Defaults</button>
    <button class="btn btn-primary" id="btn-copy">Copy Prompt</button>
  </div>

</div><!-- /app -->

<script>
(function () {
  'use strict';

  /* ── State ──────────────────────────────────────────────── */
  const DEFAULTS = {
    width:           'full',
    navStyle:        'pill',
    activeIndicator: 'leftbar',
    iconTreatment:   'accent',
    logoTreatment:   'wordmark',
    sectionGrouping: 'grouped',
    userArea:        'avatar',
  };

  let state = Object.assign({}, DEFAULTS);

  /* ── Nav Data ───────────────────────────────────────────── */
  const NAV_SECTIONS = [
    {
      id: 'core',
      label: 'Core',
      items: [
        { id: 'dashboard',    label: 'Dashboard',     icon: '◈', badge: null },
        { id: 'meetings',     label: 'Meetings',      icon: '◎', badge: '3' },
        { id: 'projects',     label: 'Projects',      icon: '⬡', badge: null },
        { id: 'projectboard', label: 'Project Board', icon: '⊞', badge: null },
        { id: 'tasks',        label: 'Tasks',         icon: '◻', badge: '12' },
      ],
    },
    {
      id: 'automation',
      label: 'Automation',
      items: [
        { id: 'automations',  label: 'Automations',   icon: '⚡', badge: null },
        { id: 'workflows',    label: 'Workflows',     icon: '⇌', badge: null },
        { id: 'agents',       label: 'AI Agents',     icon: '◬', badge: null },
      ],
    },
    {
      id: 'insights',
      label: 'Insights',
      items: [
        { id: 'goals',        label: 'Goals',         icon: '◎', badge: null },
        { id: 'analytics',    label: 'Analytics',     icon: '▲', badge: null },
        { id: 'reports',      label: 'Reports',       icon: '▦', badge: null },
        { id: 'calendar',     label: 'Calendar',      icon: '◫', badge: null },
        { id: 'search',       label: 'Search',        icon: '⊙', badge: null },
      ],
    },
  ];

  const ACTIVE_ID = 'meetings';

  /* ── SVG icons used inline ─────────────────────────────── */
  function makeSvgLogo(size) {
    const s = size || 28;
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    el.setAttribute('width', String(s));
    el.setAttribute('height', String(s));
    el.setAttribute('viewBox', '0 0 28 28');
    el.setAttribute('fill', 'none');

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('width', '28'); rect.setAttribute('height', '28');
    rect.setAttribute('rx', '7');
    rect.setAttribute('fill', '#FF2D6B');
    rect.setAttribute('fill-opacity', '0.15');

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M7 9.5L14 6L21 9.5V14.5C21 18.09 17.87 21.36 14 22.5C10.13 21.36 7 18.09 7 14.5V9.5Z');
    path.setAttribute('stroke', '#FF2D6B');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('fill', 'none');

    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', '14'); circle.setAttribute('cy', '14'); circle.setAttribute('r', '2.5');
    circle.setAttribute('fill', '#FF2D6B');

    el.appendChild(rect);
    el.appendChild(path);
    el.appendChild(circle);
    return el;
  }

  /* ── Width map ─────────────────────────────────────────── */
  const WIDTH_MAP = { icon: '52px', compact: '180px', full: '240px' };

  /* ── Render Sidebar ────────────────────────────────────── */
  function renderSidebar() {
    const sidebar    = document.getElementById('sidebar');
    const logoArea   = document.getElementById('sb-logo-area');
    const navEl      = document.getElementById('sb-nav');
    const settingsEl = document.getElementById('sb-settings');
    const userEl     = document.getElementById('sb-user');

    const isIcon    = state.width === 'icon';
    const isCompact = state.width === 'compact';
    const isFull    = state.width === 'full';

    /* Width */
    sidebar.style.width = WIDTH_MAP[state.width];

    /* ── Logo area ── */
    while (logoArea.firstChild) logoArea.removeChild(logoArea.lastChild);

    logoArea.style.padding = isIcon ? '14px 0' : '16px 16px';
    logoArea.style.justifyContent = isIcon ? 'center' : 'flex-start';

    const svgLogo = makeSvgLogo(isIcon ? 26 : 28);
    logoArea.appendChild(svgLogo);

    if (state.logoTreatment === 'wordmark' && !isIcon) {
      const wm = document.createElement('span');
      wm.style.fontFamily = 'var(--en-font-display)';
      wm.style.fontWeight = '800';
      wm.style.fontSize = '16px';
      wm.style.letterSpacing = '-0.02em';
      wm.style.color = 'var(--en-text-primary)';
      wm.style.marginLeft = '10px';
      const wm1 = document.createTextNode('ento');
      const wm2 = document.createElement('span');
      wm2.style.color = 'var(--en-primary)';
      wm2.textContent = 'mate';
      wm.appendChild(wm1);
      wm.appendChild(wm2);
      logoArea.appendChild(wm);
    }

    if (state.logoTreatment === 'pulse') {
      // Add pulse ring to logo svg wrapper
      const wrapper = document.createElement('div');
      wrapper.style.position = 'relative';
      wrapper.style.display = 'flex';
      wrapper.style.alignItems = 'center';
      wrapper.style.justifyContent = 'center';
      const dot = document.createElement('div');
      dot.classList.add('pulse-dot');
      dot.style.top = '-2px';
      dot.style.right = '-2px';
      dot.style.width = '8px';
      dot.style.height = '8px';
      // Reparent svgLogo into wrapper
      logoArea.removeChild(svgLogo);
      wrapper.appendChild(svgLogo);
      wrapper.appendChild(dot);
      logoArea.insertBefore(wrapper, logoArea.firstChild);

      if (!isIcon) {
        const wm = document.createElement('span');
        wm.style.fontFamily = 'var(--en-font-display)';
        wm.style.fontWeight = '800';
        wm.style.fontSize = '16px';
        wm.style.letterSpacing = '-0.02em';
        wm.style.color = 'var(--en-text-primary)';
        wm.style.marginLeft = '10px';
        const wm1 = document.createTextNode('ento');
        const wm2 = document.createElement('span');
        wm2.style.color = 'var(--en-primary)';
        wm2.textContent = 'mate';
        wm.appendChild(wm1);
        wm.appendChild(wm2);
        logoArea.appendChild(wm);
      }
    }

    /* ── Nav ── */
    while (navEl.firstChild) navEl.removeChild(navEl.lastChild);

    navEl.style.padding = isIcon ? '8px 0' : '8px 0';

    const sg = state.sectionGrouping;
    const collSections = {};

    if (sg === 'none') {
      // Flat list, no labels
      const allItems = [];
      NAV_SECTIONS.forEach(sec => sec.items.forEach(item => allItems.push(item)));
      allItems.forEach(item => {
        navEl.appendChild(buildNavItem(item, isIcon));
      });

    } else if (sg === 'grouped') {
      NAV_SECTIONS.forEach((sec, si) => {
        if (!isIcon) {
          const labelRow = document.createElement('div');
          labelRow.style.padding = '12px 16px 6px';
          labelRow.style.display = 'flex';
          labelRow.style.alignItems = 'center';
          if (si > 0) labelRow.style.marginTop = '4px';

          const lbl = document.createElement('span');
          lbl.classList.add('nav-section-label');
          lbl.textContent = sec.label.toUpperCase();
          labelRow.appendChild(lbl);
          navEl.appendChild(labelRow);
        } else {
          // small divider in icon mode
          if (si > 0) {
            const div = document.createElement('div');
            div.style.height = '1px';
            div.style.background = 'var(--en-border-default)';
            div.style.margin = '6px 8px';
            navEl.appendChild(div);
          }
        }
        sec.items.forEach(item => {
          navEl.appendChild(buildNavItem(item, isIcon));
        });
      });

    } else if (sg === 'collapsible') {
      NAV_SECTIONS.forEach((sec, si) => {
        const sectionWrap = document.createElement('div');
        sectionWrap.style.marginTop = si > 0 ? '4px' : '0';

        if (!isIcon) {
          const headerRow = document.createElement('div');
          headerRow.classList.add('section-header');
          headerRow.style.padding = '10px 16px 6px';
          headerRow.style.gap = '6px';

          const lbl = document.createElement('span');
          lbl.classList.add('nav-section-label');
          lbl.style.flex = '1';
          lbl.textContent = sec.label.toUpperCase();

          const chev = document.createElement('span');
          chev.classList.add('section-chevron');
          chev.textContent = '▾';
          chev.style.fontSize = '12px';

          headerRow.appendChild(lbl);
          headerRow.appendChild(chev);

          const itemsWrap = document.createElement('div');
          itemsWrap.classList.add('section-items');
          sec.items.forEach(item => {
            itemsWrap.appendChild(buildNavItem(item, isIcon));
          });

          headerRow.addEventListener('click', function () {
            sectionWrap.classList.toggle('section-collapsed');
          });

          sectionWrap.appendChild(headerRow);
          sectionWrap.appendChild(itemsWrap);
        } else {
          if (si > 0) {
            const div = document.createElement('div');
            div.style.height = '1px';
            div.style.background = 'var(--en-border-default)';
            div.style.margin = '6px 8px';
            sectionWrap.appendChild(div);
          }
          sec.items.forEach(item => {
            sectionWrap.appendChild(buildNavItem(item, isIcon));
          });
        }
        navEl.appendChild(sectionWrap);
      });
    }

    /* ── Settings ── */
    while (settingsEl.firstChild) settingsEl.removeChild(settingsEl.lastChild);

    const settingsItem = document.createElement('div');
    settingsItem.classList.add('settings-item');
    applyNavItemPadding(settingsItem, isIcon);

    const sIcon = document.createElement('span');
    sIcon.style.width = isIcon ? '100%' : '';
    sIcon.style.textAlign = isIcon ? 'center' : '';
    sIcon.style.fontSize = '16px';
    sIcon.textContent = '⚙';
    applyIconTreatment(sIcon, false);
    settingsItem.appendChild(sIcon);

    if (!isIcon) {
      const sLbl = document.createElement('span');
      sLbl.textContent = 'Settings';
      settingsItem.appendChild(sLbl);
    }
    settingsEl.appendChild(settingsItem);

    /* ── User area ── */
    while (userEl.firstChild) userEl.removeChild(userEl.lastChild);

    userEl.style.borderTop = '1px solid var(--en-border-default)';

    const ua = state.userArea;

    if (ua === 'minimal') {
      userEl.style.padding = isIcon ? '10px 0' : '10px 16px';
      userEl.style.justifyContent = isIcon ? 'center' : 'flex-start';

      const avatar = makeAvatar(isIcon ? 28 : 28);
      userEl.appendChild(avatar);

      if (!isIcon) {
        const name = document.createElement('span');
        name.style.fontFamily = 'var(--en-font-body)';
        name.style.fontSize = '13px';
        name.style.fontWeight = '500';
        name.style.color = 'var(--en-text-secondary)';
        name.style.marginLeft = '10px';
        name.textContent = 'A. Reyes';
        userEl.appendChild(name);
      }

    } else if (ua === 'avatar') {
      if (isIcon) {
        userEl.style.padding = '10px 0';
        userEl.style.justifyContent = 'center';
        userEl.appendChild(makeAvatar(28));
      } else {
        userEl.style.padding = '12px 12px';
        userEl.style.gap = '0';

        const card = document.createElement('div');
        card.style.width = '100%';
        card.style.display = 'flex';
        card.style.alignItems = 'center';
        card.style.gap = '10px';
        card.style.padding = '8px 10px';
        card.style.borderRadius = '8px';
        card.style.background = 'var(--en-bg-elevated)';
        card.style.border = '1px solid var(--en-border-default)';
        card.style.cursor = 'pointer';

        card.appendChild(makeAvatar(28));

        const info = document.createElement('div');
        info.style.flex = '1';
        info.style.minWidth = '0';

        const nm = document.createElement('div');
        nm.style.fontFamily = 'var(--en-font-body)';
        nm.style.fontSize = '13px';
        nm.style.fontWeight = '600';
        nm.style.color = 'var(--en-text-primary)';
        nm.style.overflow = 'hidden';
        nm.style.textOverflow = 'ellipsis';
        nm.style.whiteSpace = 'nowrap';
        nm.textContent = 'Alex Reyes';

        const role = document.createElement('div');
        role.style.fontFamily = 'var(--en-font-body)';
        role.style.fontSize = '11px';
        role.style.color = 'var(--en-text-secondary)';
        role.textContent = 'Product Lead';

        info.appendChild(nm);
        info.appendChild(role);
        card.appendChild(info);

        const chevR = document.createElement('span');
        chevR.style.color = 'var(--en-text-secondary)';
        chevR.style.fontSize = '12px';
        chevR.textContent = '⋮';
        card.appendChild(chevR);

        userEl.appendChild(card);
      }

    } else if (ua === 'expanded') {
      if (isIcon) {
        userEl.style.padding = '10px 0';
        userEl.style.justifyContent = 'center';
        userEl.appendChild(makeAvatar(28));
      } else {
        userEl.style.padding = '14px 16px';
        userEl.style.flexDirection = 'column';
        userEl.style.alignItems = 'flex-start';
        userEl.style.gap = '10px';

        // Status row
        const statusRow = document.createElement('div');
        statusRow.style.display = 'flex';
        statusRow.style.alignItems = 'center';
        statusRow.style.gap = '6px';
        statusRow.style.width = '100%';

        const statusDot = document.createElement('div');
        statusDot.style.width = '7px';
        statusDot.style.height = '7px';
        statusDot.style.borderRadius = '50%';
        statusDot.style.background = 'var(--en-secondary)';
        statusDot.style.flexShrink = '0';

        const statusLbl = document.createElement('span');
        statusLbl.style.fontFamily = 'var(--en-font-body)';
        statusLbl.style.fontSize = '11px';
        statusLbl.style.color = 'var(--en-text-secondary)';
        statusLbl.textContent = 'Active — In a meeting';

        statusRow.appendChild(statusDot);
        statusRow.appendChild(statusLbl);

        // Avatar + info
        const infoRow = document.createElement('div');
        infoRow.style.display = 'flex';
        infoRow.style.alignItems = 'center';
        infoRow.style.gap = '10px';
        infoRow.style.width = '100%';

        infoRow.appendChild(makeAvatar(34));

        const textBlock = document.createElement('div');
        textBlock.style.flex = '1';
        textBlock.style.minWidth = '0';

        const nm2 = document.createElement('div');
        nm2.style.fontFamily = 'var(--en-font-body)';
        nm2.style.fontSize = '13px';
        nm2.style.fontWeight = '600';
        nm2.style.color = 'var(--en-text-primary)';
        nm2.textContent = 'Alex Reyes';

        const emailLbl = document.createElement('div');
        emailLbl.style.fontFamily = 'var(--en-font-body)';
        emailLbl.style.fontSize = '11px';
        emailLbl.style.color = 'var(--en-text-secondary)';
        emailLbl.style.overflow = 'hidden';
        emailLbl.style.textOverflow = 'ellipsis';
        emailLbl.style.whiteSpace = 'nowrap';
        emailLbl.textContent = 'alex@company.io';

        textBlock.appendChild(nm2);
        textBlock.appendChild(emailLbl);
        infoRow.appendChild(textBlock);

        // Actions
        const actRow = document.createElement('div');
        actRow.style.display = 'flex';
        actRow.style.gap = '6px';
        actRow.style.width = '100%';

        const logoutBtn = document.createElement('button');
        logoutBtn.style.flex = '1';
        logoutBtn.style.padding = '6px 0';
        logoutBtn.style.border = '1px solid var(--en-border-default)';
        logoutBtn.style.borderRadius = '6px';
        logoutBtn.style.background = 'var(--en-bg-elevated)';
        logoutBtn.style.color = 'var(--en-text-secondary)';
        logoutBtn.style.fontFamily = 'var(--en-font-body)';
        logoutBtn.style.fontSize = '11px';
        logoutBtn.style.cursor = 'pointer';
        logoutBtn.textContent = 'Sign out';

        const profileBtn = document.createElement('button');
        profileBtn.style.flex = '1';
        profileBtn.style.padding = '6px 0';
        profileBtn.style.border = '1px solid rgba(255,45,107,0.3)';
        profileBtn.style.borderRadius = '6px';
        profileBtn.style.background = 'var(--en-primary-dim)';
        profileBtn.style.color = 'var(--en-primary)';
        profileBtn.style.fontFamily = 'var(--en-font-body)';
        profileBtn.style.fontSize = '11px';
        profileBtn.style.cursor = 'pointer';
        profileBtn.textContent = 'Profile';

        actRow.appendChild(logoutBtn);
        actRow.appendChild(profileBtn);

        userEl.appendChild(statusRow);
        userEl.appendChild(infoRow);
        userEl.appendChild(actRow);
      }
    }
  }

  /* ── Build a nav item ──────────────────────────────────── */
  function buildNavItem(item, isIcon) {
    const el = document.createElement('div');
    el.classList.add('nav-item');
    if (item.id === ACTIVE_ID) el.classList.add('active');

    applyNavItemPadding(el, isIcon);
    applyNavItemStyle(el, item.id === ACTIVE_ID);

    // Icon
    const iconSpan = document.createElement('span');
    iconSpan.classList.add('nav-icon');
    iconSpan.textContent = item.icon;
    if (isIcon) {
      iconSpan.style.width = '100%';
      iconSpan.style.justifyContent = 'center';
    }
    applyIconTreatment(iconSpan, item.id === ACTIVE_ID);
    el.appendChild(iconSpan);

    if (!isIcon) {
      const labelSpan = document.createElement('span');
      labelSpan.classList.add('nav-label');
      labelSpan.textContent = item.label;
      el.appendChild(labelSpan);

      if (item.badge) {
        const badge = document.createElement('span');
        badge.classList.add('nav-badge');
        badge.textContent = item.badge;
        el.appendChild(badge);
      }
    }

    return el;
  }

  /* ── Nav item padding ──────────────────────────────────── */
  function applyNavItemPadding(el, isIcon) {
    const ns = state.navStyle;
    if (isIcon) {
      el.style.padding = '8px 0';
      el.style.margin = ns === 'card' ? '3px 6px' : ns === 'pill' ? '2px 6px' : '0';
      el.style.borderRadius = ns === 'pill' || ns === 'card' ? '8px' : '0';
    } else {
      if (ns === 'pill') {
        el.style.padding = '8px 12px';
        el.style.margin = '2px 8px';
        el.style.borderRadius = '8px';
      } else if (ns === 'fullbleed') {
        el.style.padding = '9px 16px';
        el.style.margin = '0';
        el.style.borderRadius = '0';
      } else if (ns === 'card') {
        el.style.padding = '9px 12px';
        el.style.margin = '3px 8px';
        el.style.borderRadius = '10px';
        el.style.border = '1px solid transparent';
      }
    }
  }

  /* ── Nav item active/hover visual ─────────────────────── */
  function applyNavItemStyle(el, isActive) {
    const ai = state.activeIndicator;
    const ns = state.navStyle;

    // Reset
    el.style.background = '';
    el.style.boxShadow = '';
    el.style.borderBottom = '';
    el.style.borderLeft = '';
    el.style.border = ns === 'card' ? '1px solid transparent' : '';

    if (!isActive) return;

    if (ai === 'leftbar') {
      if (state.width === 'icon') {
        el.style.background = 'var(--en-primary-dim)';
        el.style.color = 'var(--en-primary)';
        el.style.borderLeft = '2px solid var(--en-primary)';
      } else {
        el.style.background = 'var(--en-primary-dim)';
        el.style.color = 'var(--en-primary)';
        if (ns === 'fullbleed') {
          el.style.borderLeft = '3px solid var(--en-primary)';
        } else {
          el.style.borderLeft = '2px solid var(--en-primary)';
        }
      }
    } else if (ai === 'glow') {
      el.style.background = 'var(--en-primary-dim)';
      el.style.color = 'var(--en-primary)';
      el.style.boxShadow = '0 0 16px var(--en-primary-glow), inset 0 0 12px rgba(255,45,107,0.06)';
      el.style.border = ns === 'card' ? '1px solid rgba(255,45,107,0.25)' : '';
    } else if (ai === 'dot') {
      el.style.background = ns === 'card' ? 'var(--en-bg-elevated)' : 'rgba(248,240,242,0.04)';
      el.style.color = 'var(--en-text-primary)';
      el.style.border = ns === 'card' ? '1px solid var(--en-border-default)' : '';
      // dot appended by caller if needed; we'll handle with a pseudo via inline
    } else if (ai === 'underline') {
      el.style.background = ns === 'card' ? 'var(--en-bg-elevated)' : 'transparent';
      el.style.color = 'var(--en-primary)';
      el.style.borderBottom = '2px solid var(--en-primary)';
    }
  }

  /* ── Icon treatment ────────────────────────────────────── */
  function applyIconTreatment(iconEl, isActive) {
    const it = state.iconTreatment;

    // Reset
    iconEl.style.color = '';
    iconEl.style.background = '';
    iconEl.style.borderRadius = '';
    iconEl.style.padding = '';
    iconEl.style.width = '';
    iconEl.style.height = '';
    iconEl.style.display = '';

    if (it === 'mono') {
      iconEl.style.color = isActive ? 'var(--en-text-primary)' : 'var(--en-text-secondary)';
    } else if (it === 'accent') {
      iconEl.style.color = isActive ? 'var(--en-primary)' : 'var(--en-text-secondary)';
    } else if (it === 'filled') {
      if (isActive) {
        iconEl.style.color = '#fff';
        iconEl.style.background = 'var(--en-primary)';
        iconEl.style.borderRadius = '7px';
        iconEl.style.padding = '5px';
        iconEl.style.display = 'inline-flex';
        iconEl.style.alignItems = 'center';
        iconEl.style.justifyContent = 'center';
      } else {
        iconEl.style.color = 'var(--en-text-secondary)';
        iconEl.style.background = 'rgba(248,240,242,0.05)';
        iconEl.style.borderRadius = '7px';
        iconEl.style.padding = '5px';
        iconEl.style.display = 'inline-flex';
        iconEl.style.alignItems = 'center';
        iconEl.style.justifyContent = 'center';
      }
    }
  }

  /* ── Avatar helper ─────────────────────────────────────── */
  function makeAvatar(size) {
    const av = document.createElement('div');
    av.style.width = size + 'px';
    av.style.height = size + 'px';
    av.style.borderRadius = '50%';
    av.style.background = 'linear-gradient(135deg, var(--en-primary) 0%, #8B1A4A 100%)';
    av.style.display = 'flex';
    av.style.alignItems = 'center';
    av.style.justifyContent = 'center';
    av.style.flexShrink = '0';
    av.style.fontSize = size > 30 ? '13px' : '11px';
    av.style.fontFamily = 'var(--en-font-display)';
    av.style.fontWeight = '700';
    av.style.color = '#fff';
    av.style.letterSpacing = '0.02em';
    av.textContent = 'AR';
    return av;
  }

  /* ── Prompt generation ─────────────────────────────────── */
  const LABEL_MAP = {
    width: {
      icon:     'icon-only (52px)',
      compact:  'compact (180px)',
      full:     'full-width (240px)',
    },
    navStyle: {
      pill:      'pill nav items',
      fullbleed: 'full-bleed nav items',
      card:      'floating card nav items',
    },
    activeIndicator: {
      leftbar:   'left-bar active indicator',
      glow:      'glow-fill active indicator',
      dot:       'dot active indicator',
      underline: 'underline active indicator',
    },
    iconTreatment: {
      mono:   'monochrome icons',
      accent: 'accent-colored icons',
      filled: 'filled-bg icons',
    },
    logoTreatment: {
      wordmark: 'wordmark logo',
      icononly: 'icon-only logo',
      pulse:    'pulse-animated logo',
    },
    sectionGrouping: {
      none:        'no section grouping',
      grouped:     'grouped sections',
      collapsible: 'collapsible section grouping',
    },
    userArea: {
      minimal:  'minimal user area',
      avatar:   'avatar card user area',
      expanded: 'expanded user area',
    },
  };

  function generatePrompt() {
    return [
      'Void \u00d7 Crimson sidebar \u2014',
      LABEL_MAP.width[state.width] + ',',
      LABEL_MAP.navStyle[state.navStyle] + ',',
      LABEL_MAP.activeIndicator[state.activeIndicator] + ',',
      LABEL_MAP.iconTreatment[state.iconTreatment] + ',',
      LABEL_MAP.logoTreatment[state.logoTreatment] + ',',
      LABEL_MAP.sectionGrouping[state.sectionGrouping] + ',',
      LABEL_MAP.userArea[state.userArea] + '.',
    ].join(' ');
  }

  function updatePrompt() {
    document.getElementById('prompt-output').value = generatePrompt();
  }

  /* ── Segmented control wiring ──────────────────────────── */
  document.querySelectorAll('.seg-ctrl').forEach(function (ctrl) {
    ctrl.addEventListener('click', function (e) {
      const btn = e.target.closest('.seg-btn');
      if (!btn) return;
      const key = ctrl.dataset.ctrl;
      const val = btn.dataset.val;

      // Update buttons
      ctrl.querySelectorAll('.seg-btn').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });

      state[key] = val;
      renderSidebar();
      updatePrompt();
    });
  });

  /* ── Reset ─────────────────────────────────────────────── */
  document.getElementById('btn-reset').addEventListener('click', function () {
    state = Object.assign({}, DEFAULTS);

    document.querySelectorAll('.seg-ctrl').forEach(function (ctrl) {
      const key = ctrl.dataset.ctrl;
      const def = DEFAULTS[key];
      ctrl.querySelectorAll('.seg-btn').forEach(function (b) {
        b.classList.toggle('active', b.dataset.val === def);
      });
    });

    renderSidebar();
    updatePrompt();
  });

  /* ── Copy ──────────────────────────────────────────────── */
  document.getElementById('btn-copy').addEventListener('click', function () {
    const text = document.getElementById('prompt-output').value;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () {
        const btn = document.getElementById('btn-copy');
        btn.textContent = 'Copied!';
        setTimeout(function () { btn.textContent = 'Copy Prompt'; }, 1800);
      });
    }
  });

  /* ── Initial render ────────────────────────────────────── */
  renderSidebar();
  updatePrompt();

})();
</script>
</body>
</html>
