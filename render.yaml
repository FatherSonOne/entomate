# Render Blueprint — Entomate Backend
# Deploy via: https://dashboard.render.com → New → Blueprint → connect this repo

services:
  - type: web
    name: entomate
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon  # matches Supabase (aws-us-west-2) for low-latency DB access
    plan: free      # upgrade to starter ($7/mo) to avoid spin-down before GA
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: FRONTEND_URL
        sync: false  # set manually
      - key: CORS_ORIGINS
        sync: false  # set manually
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false  # set manually (secret)
      - key: SUPABASE_URL
        sync: false  # set manually
      - key: SUPABASE_ANON_KEY
        sync: false  # set manually
      - key: SUPABASE_SERVICE_KEY
        sync: false  # set manually (secret)
      - key: HUB_SUPABASE_URL
        sync: false  # set manually (same as SUPABASE_URL)
      - key: HUB_SUPABASE_ANON_KEY
        sync: false  # set manually
      - key: HUB_SUPABASE_SERVICE_KEY
        sync: false  # set manually (secret)
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info

      # ----- Required in production (server.js:90 throws if unset) -----
      - key: SESSION_SECRET
        sync: false  # set manually (secret) — generate with: openssl rand -hex 32

      # ----- Auth (Clerk) -----
      - key: CLERK_SECRET_KEY
        sync: false  # set manually (secret)
      - key: JWT_SECRET
        sync: false  # set manually (secret)

      # ----- Ecosystem cross-app (Pulse + Logos Vision) -----
      - key: PULSE_SUPABASE_ANON_KEY
        sync: false  # set manually
      - key: LOGOS_VISION_SUPABASE_ANON_KEY
        sync: false  # set manually

      # ----- Chat / CRM providers -----
      - key: CHAT_PROVIDER
        sync: false  # set manually
      - key: CRM_PROVIDER
        sync: false  # set manually
      - key: CRM_API_KEY
        sync: false  # set manually (secret)

      # ----- Slack -----
      - key: SLACK_BOT_TOKEN
        sync: false  # set manually (secret)
      - key: SLACK_DEFAULT_CHANNEL
        sync: false  # set manually

      # ----- Bot fleet (Recall.ai) -----
      # See docs/setup/RENDER_DEPLOY.md and docs/runbooks/BOT_OPS.md.
      # We pivoted from in-house Fly bots → Recall.ai after Google CAPTCHA-
      # blocked our datacenter-IP headless Chromium. Re-evaluate at M-PR.
      - key: BOT_CALLBACK_BASE_URL
        sync: false  # https://<svc>.onrender.com — set after first deploy
      - key: RECALL_API_KEY
        sync: false  # set manually (secret) — from Recall.ai dashboard
      - key: RECALL_API_BASE
        value: https://us-east-1.recall.ai/api/v1
      - key: RECALL_WEBHOOK_TOKEN
        sync: false  # generate with: node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"
