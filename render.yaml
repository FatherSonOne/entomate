# Render Blueprint — Entomate Backend
# Deploy via: https://dashboard.render.com → New → Blueprint → connect this repo

services:
  - type: web
    name: entomate
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon  # matches Supabase (aws-us-west-2) for low-latency DB access
    plan: free      # upgrade to starter ($7/mo) to avoid spin-down before GA
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: FRONTEND_URL
        sync: false  # set manually
      - key: CORS_ORIGINS
        sync: false  # set manually
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false  # set manually (secret)
      - key: SUPABASE_URL
        sync: false  # set manually
      - key: SUPABASE_ANON_KEY
        sync: false  # set manually
      - key: SUPABASE_SERVICE_KEY
        sync: false  # set manually (secret)
      - key: HUB_SUPABASE_URL
        sync: false  # set manually (same as SUPABASE_URL)
      - key: HUB_SUPABASE_ANON_KEY
        sync: false  # set manually
      - key: HUB_SUPABASE_SERVICE_KEY
        sync: false  # set manually (secret)
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info

      # ----- Required in production (server.js:90 throws if unset) -----
      - key: SESSION_SECRET
        sync: false  # set manually (secret) — generate with: openssl rand -hex 32
      - key: INTERNAL_API_KEY
        sync: false  # set manually (secret) — openssl rand -hex 32. Shared with the ecosystem-inbound edge function and the nightly-jobs GitHub Action (ENTOMATE_INTERNAL_API_KEY).
      - key: SECRETS_MASTER_KEY
        sync: false  # set manually (secret) — openssl rand -hex 32. Secrets vault is locked without it. Never rotate without re-encrypting stored secrets.

      # ----- Auth (Clerk) -----
      - key: CLERK_SECRET_KEY
        sync: false  # set manually (secret)
      - key: JWT_SECRET
        sync: false  # set manually (secret)

      # ----- Ecosystem cross-app (Pulse + Logos Vision) -----
      - key: PULSE_SUPABASE_ANON_KEY
        sync: false  # set manually
      - key: LOGOS_VISION_SUPABASE_ANON_KEY
        sync: false  # set manually

      # ----- Chat / CRM providers -----
      - key: CHAT_PROVIDER
        sync: false  # set manually
      - key: CRM_PROVIDER
        sync: false  # set manually
      - key: CRM_API_KEY
        sync: false  # set manually (secret)
      - key: CRM_ORG_ID
        sync: false  # org id that owns CRM_API_KEY; CRM calls from other orgs are skipped

      # ----- Slack -----
      - key: SLACK_BOT_TOKEN
        sync: false  # set manually (secret)
      - key: SLACK_DEFAULT_CHANNEL
        sync: false  # set manually

      # ----- Bot fleet (Recall.ai) -----
      # See docs/setup/RENDER_DEPLOY.md and docs/runbooks/BOT_OPS.md.
      # We pivoted from in-house Fly bots → Recall.ai after Google CAPTCHA-
      # blocked our datacenter-IP headless Chromium. Re-evaluate at M-PR.
      - key: BOT_CALLBACK_BASE_URL
        sync: false  # https://<svc>.onrender.com — set after first deploy
      - key: RECALL_API_KEY
        sync: false  # set manually (secret) — from Recall.ai dashboard
      - key: RECALL_API_BASE
        value: https://us-west-2.recall.ai/api/v1  # co-located with Render oregon + Supabase us-west-2
      - key: RECALL_WEBHOOK_SIGNING_SECRET
        sync: false  # Svix whsec_... secret from Recall dashboard > Webhooks. Without it every bot status webhook is rejected (GET /health/status shows recall: error).

      # ----- Live meeting rooms (Daily) -----
      - key: DAILY_API_KEY
        sync: false  # set manually (secret)

      # ----- Billing (Stripe) -----
      # Prices are found by lookup key; create them with backend/scripts/stripe-bootstrap-prices.js.
      - key: STRIPE_SECRET_KEY
        sync: false  # set manually (secret) — sk_live_... (or sk_test_... for a test deploy)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # whsec_... of the endpoint https://<svc>.onrender.com/api/billing/webhook
