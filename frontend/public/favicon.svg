<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Entomate</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0810"/>
      <stop offset="100%" stop-color="#0d0408"/>
    </linearGradient>
  </defs>

  <!-- Background square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Crimson border -->
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#FF2D6B" stroke-width="2" stroke-opacity="0.6" fill="none"/>

  <!-- E letterform — bold, centered, white -->
  <!-- Top bar -->
  <rect x="14" y="16" width="36" height="8" rx="4" fill="white"/>
  <!-- Middle bar (shorter) -->
  <rect x="14" y="28" width="26" height="8" rx="4" fill="white" opacity="0.85"/>
  <!-- Bottom bar -->
  <rect x="14" y="40" width="36" height="8" rx="4" fill="white"/>

  <!-- Amber dot accent — top right -->
  <circle cx="52" cy="12" r="5" fill="#FFB800"/>
</svg>
