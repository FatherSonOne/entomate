<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Entomate</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0810"/>
      <stop offset="100%" stop-color="#0d0408"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#FF2D6B" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>

  <!-- Three E bars (crimson) -->
  <rect x="22" y="14" width="26" height="6" rx="1.5" fill="#FF2D6B"/>
  <rect x="22" y="29" width="20" height="6" rx="1.5" fill="#FF2D6B" opacity="0.85"/>
  <rect x="22" y="44" width="26" height="6" rx="1.5" fill="#FF2D6B"/>

  <!-- Circuit traces -->
  <path d="M22 17 L14 17 L10 13" stroke="#FF2D6B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="10" cy="13" r="2" fill="#FF2D6B" opacity="0.9"/>
  <path d="M22 32 L12 32 L8 28" stroke="#FF2D6B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="8" cy="28" r="2" fill="#FF2D6B" opacity="0.9"/>
  <path d="M22 47 L14 47 L10 51" stroke="#FF2D6B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="10" cy="51" r="2" fill="#FF2D6B" opacity="0.9"/>

  <!-- Small accent node -->
  <path d="M22 14 L18 10" stroke="#FF2D6B" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <circle cx="18" cy="10" r="1.5" fill="#FF2D6B" opacity="0.6"/>
</svg>
