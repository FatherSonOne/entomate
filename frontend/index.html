    <script>
      // Apply the saved design style before first paint (ThemeContext keeps it in sync).
      try {
        var s = localStorage.getItem('entomate-style');
        if (s === 'classic') document.documentElement.removeAttribute('data-style');
        else if (s === 'folio' || s === 'bench' || s === 'minutes') document.documentElement.setAttribute('data-style', s);
      } catch (e) {}
    </script>
