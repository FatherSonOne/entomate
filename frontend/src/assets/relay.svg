    <path data-current="top" d="M289 500C289 383.5 383.5 289 500 289C616.5 289 711 383.5 711 500" pathLength="1" stroke-dasharray=".23 2" stroke-dashoffset=".23" opacity="0" fill="none" stroke="#ffdbab" stroke-width="16" stroke-linecap="round" filter="url(#relay-mark-current-glow)"/>
    <path data-current="bottom" d="M711 500C711 616.5 616.5 711 500 711C383.5 711 289 616.5 289 500" pathLength="1" stroke-dasharray=".23 2" stroke-dashoffset=".23" opacity="0" fill="none" stroke="#effff5" stroke-width="16" stroke-linecap="round" filter="url(#relay-mark-current-glow)"/>
