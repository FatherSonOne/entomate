<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Relay">
  <title>Relay</title>
  <view id="relay-mark-compact" viewBox="54 54 892 892"/>
  <defs>
    <linearGradient id="relay-mark-copper" x1=".12" x2=".78" y1="0" y2="1">
      <stop stop-color="#552536"/><stop offset=".25" stop-color="#ed7e69"/>
      <stop offset=".48" stop-color="#9b3444"/><stop offset=".72" stop-color="#402537"/>
      <stop offset="1" stop-color="#de6a55"/>
    </linearGradient>
    <linearGradient id="relay-mark-edge" x1=".18" x2=".81" y1="0" y2="1">
      <stop stop-color="#b75859"/><stop offset=".24" stop-color="#ffc8a2"/>
      <stop offset=".49" stop-color="#c35b56"/><stop offset=".7" stop-color="#593346"/>
      <stop offset="1" stop-color="#faab8b"/>
    </linearGradient>
    <linearGradient id="relay-mark-glass" x1="0" x2=".85" y1="0" y2="1">
      <stop stop-color="#8ef6d5"/><stop offset=".26" stop-color="#d6ffed"/>
      <stop offset=".51" stop-color="#3abfa6"/><stop offset=".72" stop-color="#237379"/>
      <stop offset="1" stop-color="#74e8c8"/>
    </linearGradient>
    <linearGradient id="relay-mark-sash" x1="0" x2="1" y1=".72" y2=".2">
      <stop stop-color="#bc7770"/><stop offset=".27" stop-color="#fbd1ad"/>
      <stop offset=".53" stop-color="#f7eed6"/><stop offset=".75" stop-color="#e29378"/>
      <stop offset="1" stop-color="#a35959"/>
    </linearGradient>
    <linearGradient id="relay-mark-wire" gradientUnits="userSpaceOnUse" x1="120" x2="880" y1="500" y2="500">
      <stop stop-color="#ca6e66"/><stop offset=".22" stop-color="#fcb498"/>
      <stop offset=".78" stop-color="#fcb498"/><stop offset="1" stop-color="#ca6e66"/>
    </linearGradient>
    <radialGradient id="relay-mark-lens" cx=".35" cy=".32" r=".73">
      <stop stop-color="#b8fbe4"/><stop offset=".22" stop-color="#71ceb7"/>
      <stop offset=".57" stop-color="#285f62"/><stop offset="1" stop-color="#101928"/>
    </radialGradient>
    <radialGradient id="relay-mark-aperture" r=".5">
      <stop offset=".48" stop-color="#1e514b" stop-opacity=".06"/>
      <stop offset="1" stop-color="#35bb9e" stop-opacity=".22"/>
    </radialGradient>
    <radialGradient id="relay-mark-flare">
      <stop stop-color="#f1ffdd"/><stop offset=".22" stop-color="#c7ffe4" stop-opacity=".8"/>
      <stop offset="1" stop-color="#69e9b7" stop-opacity="0"/>
    </radialGradient>
    <filter id="relay-mark-current-glow" x="-12%" y="-24%" width="124%" height="148%">
      <feGaussianBlur stdDeviation="7" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

