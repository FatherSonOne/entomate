      <circle cx="367" cy="298" r="2.8" opacity="0"/>
      <circle cx="372" cy="284" r="1.8" opacity="0"/>
      <circle cx="388" cy="293" r="1.4" opacity="0"/>
      <circle cx="394" cy="286" r="2.2" opacity="0"/>
      <circle cx="405" cy="280" r="1.2" opacity="0"/>
      <circle cx="403" cy="295" r="2.5" opacity="0"/>
      <circle cx="419" cy="293" r="1.5" opacity="0"/>
      <circle cx="425" cy="280" r="2.5" opacity="0"/>
      <circle cx="429" cy="301" r="1.2" opacity="0"/>
      <circle cx="435" cy="296" r="2.7" opacity="0"/>
      <circle cx="447" cy="290" r="1.7" opacity="0"/>
