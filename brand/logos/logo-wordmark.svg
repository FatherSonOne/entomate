<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <title>Entomate Wordmark</title>
  <defs>
    <linearGradient id="wordmark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4B4"/>
      <stop offset="55%" stop-color="#00FFDF"/>
      <stop offset="100%" stop-color="#9B6DFF"/>
    </linearGradient>
    <!-- Catalyst Node icon -->
    <radialGradient id="mark-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFDF"/>
      <stop offset="100%" stop-color="#009E87"/>
    </radialGradient>
  </defs>
  <!-- Icon mark (48x48 centered in 60px height) -->
  <g transform="translate(6, 6)">
    <path d="M24 3 L42 13.5 L42 34.5 L24 45 L6 34.5 L6 13.5 Z" stroke="#00D4B4" stroke-width="1.2" stroke-opacity="0.35" fill="none"/>
    <path d="M24 10 L36 17 L36 31 L24 38 L12 31 L12 17 Z" stroke="#00D4B4" stroke-width="0.8" stroke-opacity="0.55" fill="rgba(0,212,180,0.06)"/>
    <line x1="24" y1="10" x2="24" y2="18" stroke="#00D4B4" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="24" y1="30" x2="24" y2="38" stroke="#00D4B4" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="12" y1="17" x2="18" y2="20.5" stroke="#00D4B4" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="36" y1="17" x2="30" y2="20.5" stroke="#00D4B4" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="12" y1="31" x2="18" y2="27.5" stroke="#00D4B4" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="36" y1="31" x2="30" y2="27.5" stroke="#00D4B4" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="24" cy="24" r="6" fill="url(#mark-core)"/>
    <circle cx="24" cy="24" r="2.5" fill="white" opacity="0.9"/>
    <circle cx="24" cy="10" r="3" fill="#00D4B4" opacity="0.7"/>
    <circle cx="24" cy="38" r="3" fill="#00D4B4" opacity="0.7"/>
    <circle cx="12" cy="17" r="2.5" fill="#9B6DFF" opacity="0.8"/>
    <circle cx="36" cy="17" r="2.5" fill="#FF8C00" opacity="0.8"/>
    <circle cx="12" cy="31" r="2.5" fill="#FF8C00" opacity="0.8"/>
    <circle cx="36" cy="31" r="2.5" fill="#9B6DFF" opacity="0.8"/>
  </g>
  <!-- Wordmark text rendered as path approximation using rect chars -->
  <!-- Using foreignObject for font rendering -->
  <text x="64" y="38" font-family="'Syne', 'Space Grotesk', system-ui" font-size="32" font-weight="800" letter-spacing="-1.5" fill="url(#wordmark-grad)">Entomate</text>
  <!-- Tagline -->
  <text x="65" y="52" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="400" letter-spacing="2.5" fill="#4D6E8A" text-transform="uppercase">INTELLIGENCE CATALYST</text>
</svg>
