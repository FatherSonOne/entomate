<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <title>Entomate — Prism Transform Mark</title>
  <defs>
    <linearGradient id="prism-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B6DFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D4B4" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Main prism triangle -->
  <path d="M40 6 L76 70 L4 70 Z" fill="url(#prism-fill)" stroke="#9B6DFF" stroke-width="1.5"/>
  <!-- Inner refraction surface -->
  <path d="M40 28 L58 62 L22 62 Z" fill="rgba(155,109,255,0.1)" stroke="#9B6DFF" stroke-width="0.75" stroke-opacity="0.5"/>
  <!-- Entry beam (top) -->
  <line x1="40" y1="6" x2="40" y2="30" stroke="white" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round"/>
  <!-- Dispersed spectrum beams (bottom) -->
  <line x1="40" y1="48" x2="12" y2="70" stroke="#00D4B4" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round"/>
  <line x1="40" y1="47" x2="20" y2="70" stroke="#39FF8F" stroke-width="1.5" stroke-opacity="0.85" stroke-linecap="round"/>
  <line x1="40" y1="46" x2="28" y2="70" stroke="#4DA6FF" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round"/>
  <line x1="40" y1="46" x2="36" y2="70" stroke="#9B6DFF" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round"/>
  <line x1="40" y1="46" x2="44" y2="70" stroke="#C4A7FF" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round"/>
  <line x1="40" y1="47" x2="52" y2="70" stroke="#FF8C00" stroke-width="2" stroke-opacity="0.85" stroke-linecap="round"/>
  <line x1="40" y1="48" x2="60" y2="70" stroke="#FF4488" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round"/>
  <line x1="40" y1="48" x2="68" y2="70" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round"/>
  <!-- Top vertex marker -->
  <circle cx="40" cy="6" r="3.5" fill="white" opacity="0.85"/>
</svg>
