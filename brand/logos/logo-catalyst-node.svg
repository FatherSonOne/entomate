<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <title>Entomate — Catalyst Node Mark</title>
  <defs>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFDF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#009E87" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer hexagon ring -->
  <path d="M40 5 L70 22.5 L70 57.5 L40 75 L10 57.5 L10 22.5 Z" stroke="#00D4B4" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  <!-- Inner hexagon -->
  <path d="M40 17 L60 28.5 L60 51.5 L40 63 L20 51.5 L20 28.5 Z" stroke="#00D4B4" stroke-width="1" stroke-opacity="0.55" fill="rgba(0,212,180,0.05)"/>
  <!-- Connector lines to satellites -->
  <line x1="40" y1="17" x2="40" y2="30" stroke="#00D4B4" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="40" y1="50" x2="40" y2="63" stroke="#00D4B4" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="20" y1="28.5" x2="30" y2="34" stroke="#00D4B4" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="60" y1="28.5" x2="50" y2="34" stroke="#00D4B4" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="20" y1="51.5" x2="30" y2="46" stroke="#00D4B4" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="60" y1="51.5" x2="50" y2="46" stroke="#00D4B4" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Central node -->
  <circle cx="40" cy="40" r="10" fill="url(#core-glow)" filter="url(#glow)"/>
  <circle cx="40" cy="40" r="4" fill="white" opacity="0.9"/>
  <!-- Satellite nodes -->
  <circle cx="40" cy="17" r="5" fill="#00D4B4" opacity="0.75"/>
  <circle cx="40" cy="63" r="5" fill="#00D4B4" opacity="0.75"/>
  <circle cx="20" cy="28.5" r="4" fill="#9B6DFF" opacity="0.85"/>
  <circle cx="60" cy="28.5" r="4" fill="#FF8C00" opacity="0.85"/>
  <circle cx="20" cy="51.5" r="4" fill="#FF8C00" opacity="0.85"/>
  <circle cx="60" cy="51.5" r="4" fill="#9B6DFF" opacity="0.85"/>
</svg>
