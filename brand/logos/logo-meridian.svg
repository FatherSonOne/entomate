<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <title>Entomate — Meridian Mark</title>
  <!-- Outer dashed orbit ring -->
  <circle cx="40" cy="40" r="36" stroke="#00D4B4" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="5 4"/>
  <!-- Main crosshair cardinal lines -->
  <line x1="40" y1="4" x2="40" y2="18" stroke="#00D4B4" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="40" y1="62" x2="40" y2="76" stroke="#00D4B4" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="4" y1="40" x2="18" y2="40" stroke="#00D4B4" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="62" y1="40" x2="76" y2="40" stroke="#00D4B4" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- Diagonal precision lines -->
  <line x1="14" y1="14" x2="22" y2="22" stroke="#9B6DFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="58" y1="58" x2="66" y2="66" stroke="#9B6DFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="66" y1="14" x2="58" y2="22" stroke="#9B6DFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="14" y1="66" x2="22" y2="58" stroke="#9B6DFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Mid ring -->
  <circle cx="40" cy="40" r="20" stroke="#00D4B4" stroke-width="1" stroke-opacity="0.45" fill="none"/>
  <!-- Inner ring -->
  <circle cx="40" cy="40" r="9" stroke="#00D4B4" stroke-width="1.5" stroke-opacity="0.8" fill="rgba(0,212,180,0.07)"/>
  <!-- Center target dot -->
  <circle cx="40" cy="40" r="4" fill="#00D4B4"/>
  <circle cx="40" cy="40" r="1.8" fill="white" opacity="0.95"/>
  <!-- Cardinal tick marks on mid ring -->
  <line x1="40" y1="20" x2="40" y2="25" stroke="#00D4B4" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="40" y1="55" x2="40" y2="60" stroke="#00D4B4" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="20" y1="40" x2="25" y2="40" stroke="#00D4B4" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="55" y1="40" x2="60" y2="40" stroke="#00D4B4" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
