<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <title>Entomate — Neural Thread Mark</title>
  <defs>
    <linearGradient id="thread-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFDF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D4B4" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="thread-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#39FF8F" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Outer slow-rotation ring hint -->
  <circle cx="40" cy="40" r="36" stroke="#00D4B4" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="8 5"/>
  <!-- Neural paths — left branch -->
  <path d="M40 10 C40 10 22 20 18 32 C14 44 27 48 31 58" stroke="#00D4B4" stroke-width="2" stroke-opacity="0.65" fill="none" stroke-linecap="round"/>
  <!-- Sub thread left -->
  <path d="M18 32 C20 36 24 36 27 40 C30 44 30 50 31 58" stroke="#00D4B4" stroke-width="1" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>
  <!-- Neural paths — right branch -->
  <path d="M40 10 C40 10 58 20 62 32 C66 44 53 48 49 58" stroke="#9B6DFF" stroke-width="2" stroke-opacity="0.65" fill="none" stroke-linecap="round"/>
  <!-- Sub thread right -->
  <path d="M62 32 C60 36 56 36 53 40 C50 44 50 50 49 58" stroke="#9B6DFF" stroke-width="1" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>
  <!-- Bottom converging path -->
  <path d="M31 58 C31 58 35 66 40 68 C45 66 49 58 49 58" stroke="#FF8C00" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <!-- Synapse nodes -->
  <!-- Top source -->
  <circle cx="40" cy="10" r="6" fill="#00D4B4" opacity="0.9"/>
  <circle cx="40" cy="10" r="2.5" fill="white" opacity="0.9"/>
  <!-- Mid-left -->
  <circle cx="18" cy="32" r="4.5" fill="#00D4B4" opacity="0.75"/>
  <!-- Mid-right -->
  <circle cx="62" cy="32" r="4.5" fill="#9B6DFF" opacity="0.75"/>
  <!-- Lower-left -->
  <circle cx="31" cy="58" r="5" fill="#FF8C00" opacity="0.85"/>
  <!-- Lower-right -->
  <circle cx="49" cy="58" r="5" fill="#FF8C00" opacity="0.85"/>
  <!-- Bottom output -->
  <circle cx="40" cy="68" r="6" fill="#39FF8F" opacity="0.9"/>
  <circle cx="40" cy="68" r="2.5" fill="white" opacity="0.9"/>
  <!-- Inner white cores on mid nodes -->
  <circle cx="18" cy="32" r="1.8" fill="white" opacity="0.6"/>
  <circle cx="62" cy="32" r="1.8" fill="white" opacity="0.6"/>
</svg>
