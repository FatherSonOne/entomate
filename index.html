<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Entomate - AI Meeting Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap');
        
        :root {
            /* CMF NOTHING DESIGN SYSTEM */

            /* COLORS - Light Mode */
            --color-white: #FFFFFF;
            --color-secondary-bg: #F5F5F5;
            --color-bg-primary: #FFFFFF;
            --color-bg-secondary: #F5F5F5;
            --color-bg-tertiary: #FAFAFA;

            --color-text-primary: #1a1a1a;
            --color-text-secondary: #666666;
            --color-text-tertiary: #999999;

            --color-accent: #2563EB; /* BLUE ACCENT - Dynamic via JS */
            --color-accent-rgb: 37, 99, 235;
            --color-accent-hover: #1d4ed8;
            --color-accent-dim: rgba(37, 99, 235, 0.08);

            --color-border: #E8E8E8;
            --color-divider: #E8E8E8;

            /* TYPOGRAPHY */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Space Mono', monospace;

            /* SPACING */
            --space-xs: 8px;
            --space-sm: 12px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 40px;

            /* RADII */
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 24px;
            --radius-full: 9999px;

            /* LAYOUT */
            --sidebar-width: 240px;
            --sidebar-width-collapsed: 72px;
        }

        /* DARK MODE - CMF Nothing Style */
        .dark {
            --color-white: #0a0a0b;
            --color-secondary-bg: #18181b;
            --color-bg-primary: #0a0a0b;
            --color-bg-secondary: #18181b;
            --color-bg-tertiary: #27272a;

            --color-text-primary: #fafafa;
            --color-text-secondary: #a1a1aa;
            --color-text-tertiary: #71717a;

            --color-accent-dim: rgba(var(--color-accent-rgb), 0.15);

            --color-border: #27272a;
            --color-divider: #27272a;
        }

        /* GLOBAL RESET */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
            background-color: var(--color-bg-primary);
            color: var(--color-text-primary);
            overflow: hidden;
            height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* UTILITIES */
        .font-mono { font-family: var(--font-mono); }
        .text-accent { color: var(--color-accent); }
        .bg-accent { background-color: var(--color-accent); }
        
        /* === 1. NAVIGATION SIDEBAR === */
        .cmf-sidebar {
            width: var(--sidebar-width);
            background-color: var(--color-bg-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: var(--space-lg) 0;
            border-right: 1px solid var(--color-border);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
            position: relative;
            z-index: 50;
            flex-shrink: 0;
        }

        .cmf-brand {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 40px;
            padding: 0 var(--space-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--color-text-primary);
            white-space: nowrap;
            overflow: hidden;
        }
        
        .cmf-brand-icon {
            width: 24px; 
            height: 24px; 
            background: var(--color-text-primary);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .cmf-nav-list {
            display: flex;
            flex-direction: column;
            gap: 4px; /* Tighter spacing for cleaner look */
            flex: 1;
            overflow-y: auto;
        }

        .cmf-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px; /* Standard padding */
            color: var(--color-text-secondary);
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            font-size: 14px;
            font-weight: 400;
            border-left: 4px solid transparent; /* Prepare for active state */
            white-space: nowrap;
            overflow: hidden;
        }

        /* Hover State */
        .cmf-menu-item:hover {
            background-color: var(--color-secondary-bg);
            color: var(--color-text-primary);
        }

        /* Active State */
        .cmf-menu-item.active {
            background-color: var(--color-secondary-bg);
            color: var(--color-text-primary);
            border-left-color: var(--color-accent); /* Teal border */
            font-weight: 500;
        }

        .cmf-menu-item.active .cmf-icon {
            color: var(--color-text-primary); /* Icon stays dark */
            stroke-width: 2; /* Slightly bolder icon on active */
        }
        
        .cmf-icon {
            width: 20px;
            height: 20px;
            stroke-width: 1.5;
            flex-shrink: 0;
            transition: color 0.2s ease;
        }

        .cmf-divider {
            height: 1px;
            background-color: var(--color-divider);
            margin: var(--space-md) var(--space-lg);
        }

        /* === 2. MAIN CONTENT AREA === */
        .cmf-main-wrapper {
            flex: 1;
            background-color: var(--color-bg-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .cmf-header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--color-border);
            background-color: var(--color-bg-primary);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .cmf-page-title {
            font-family: var(--font-sans);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--color-text-primary);
        }

        .cmf-content {
            flex: 1;
            padding: 0 40px 40px 40px;
            overflow-y: auto;
            background: var(--color-bg-primary);
            transition: background-color 0.3s ease;
        }

        /* === 3. UI COMPONENTS === */
        
        /* Nothing-style Button */
        .btn-nothing {
            background-color: var(--color-text-primary);
            color: var(--color-white);
            border-radius: var(--radius-full);
            padding: 12px 24px;
            font-weight: 500;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-nothing:hover {
            opacity: 0.9;
        }
        
        .btn-nothing.secondary {
            background-color: var(--color-secondary-bg);
            color: var(--color-text-primary);
        }
        
        .btn-nothing.accent {
            background-color: var(--color-accent);
            color: white;
        }
        
        /* Cards */
        .cmf-card {
            background: var(--color-bg-secondary);
            border-radius: var(--radius-lg);
            padding: 32px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease;
            border: 1px solid var(--color-border);
        }

        .cmf-card.dark {
            background: var(--color-text-primary);
            color: var(--color-white);
        }

        .cmf-status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--color-accent);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #E0E0E0;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #CCCCCC;
        }

        /* RESPONSIVE COLLAPSE */
        @media (max-width: 1024px) {
            .cmf-sidebar {
                width: var(--sidebar-width-collapsed);
            }
            .cmf-brand span, 
            .cmf-menu-item span,
            .cmf-profile-info {
                display: none;
            }
            .cmf-brand {
                justify-content: center;
                padding: 0;
            }
            .cmf-menu-item {
                justify-content: center;
                padding: 16px 0;
            }
            .cmf-sidebar .mt-auto {
                display: flex;
                justify-content: center;
            }
            .cmf-divider {
                margin: var(--space-md) 12px;
            }
        }
    </style>
<!-- Import map removed - Vite bundles from node_modules -->
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
