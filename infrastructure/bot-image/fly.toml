# Fly.io app config for the Entomate bot fleet (P1.1).
#
# The app container holds the bot image; individual sessions are launched
# on-demand as Machines by backend/services/botOrchestrator.js using the
# Machines API. No [http_service] block — Machines are single-shot workers
# that auto-destroy on exit, not a web service.
#
# First-time setup (run from THIS directory — infrastructure/bot-image/):
#   cd infrastructure/bot-image
#   fly apps create entomate-bot-fleet --org <your-org>
#   fly deploy --build-only --push --image-label latest --app entomate-bot-fleet
#
# Why run from this directory: build context is scoped to bot-image/, so
# COPY only sees bot deps (not the repo root entomate@1.0.0 package.json
# with its husky prepare script).
#
# The orchestrator then launches machines by reference to
# registry.fly.io/entomate-bot-fleet:latest.

app = "entomate-bot-fleet"
primary_region = "sjc"  # San Jose — matches Render oregon + Supabase us-west-2

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048

[metrics]
  port = 9091
  path = "/metrics"
