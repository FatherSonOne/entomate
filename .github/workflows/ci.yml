name: CI

# NOTE: Until 2026-07-04 this workflow ran `npm ci && npm run build && npm run test`
# at the repo ROOT, which built/tested the Google-AI-Studio prototype (root src/ +
# index.tsx) — code that was superseded by backend/ + frontend/ and has now been
# removed (S2 repo cleanup). CI now targets the real workspaces.
#
# TODO(S2 follow-up): add backend `npm run lint` + `npm test` and frontend
# `npm run lint` once backend has a local eslint config and the suites are
# verified green. The real code was never gated before, so the first runs may
# surface pre-existing issues.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
